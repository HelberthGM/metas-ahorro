name: CI/CD

on:
  pull_request:
    branches: [main]   # PR: solo validación y pruebas
  push:
    branches: [main]   # push a main: pruebas + imagen + despliegue

# Permisos mínimos por defecto; cada job pide solo lo que necesita.
permissions:
  contents: read

# En PR se cancela la ejecución anterior si llega un commit nuevo.
# En main NUNCA se cancela una ejecución en curso.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ─────────────────────────────────────────────────────────────
  test:
    name: Validación y pruebas
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Instalar Python 3.14 (con caché de pip)
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Instalar dependencias de desarrollo
        run: pip install -r requirements-dev.txt

      - name: Revisión estática (ruff)
        run: ruff check --output-format=github .

      - name: Pruebas (pytest)
        run: pytest --junitxml=reports/junit.xml

      - name: Resumen de pruebas
        if: always()
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET, os
          if not os.path.exists("reports/junit.xml"):
              print("### ⚠️ No se generó el reporte de pruebas"); raise SystemExit
          s = ET.parse("reports/junit.xml").getroot().find("testsuite")
          total, fal, err, omit = (int(s.get(k)) for k in ("tests", "failures", "errors", "skipped"))
          ok = total - fal - err - omit
          print(f"### {'✅' if fal + err == 0 else '❌'} Pruebas: {ok}/{total} correctas")
          print(f"| Correctas | Fallidas | Errores | Omitidas | Tiempo |\n|---|---|---|---|---|")
          print(f"| {ok} | {fal} | {err} | {omit} | {float(s.get('time')):.2f} s |")
          EOF

      - name: Guardar reporte JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-pruebas
          path: reports/junit.xml

  # ─────────────────────────────────────────────────────────────
  image:
    name: Construir y publicar imagen
    needs: test                       # si las pruebas fallan, no hay imagen
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write                 # solo este job puede publicar en GHCR
    outputs:
      image: ${{ steps.nombre.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Nombre de la imagen en minúsculas
        id: nombre
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en GHCR (con GITHUB_TOKEN)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false           # digest = manifiesto simple de la imagen
          build-args: |
            APP_REVISION=${{ github.sha }}
          tags: |
            ${{ steps.nombre.outputs.image }}:latest
            ${{ steps.nombre.outputs.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resumen de la imagen
        run: |
          {
            echo "### 🐳 Imagen publicada en GHCR"
            echo "| Campo | Valor |"
            echo "|---|---|"
            echo "| Imagen | \`${{ steps.nombre.outputs.image }}\` |"
            echo "| Etiquetas | \`latest\`, \`sha-${{ github.sha }}\` |"
            echo "| Digest | \`${{ steps.build.outputs.digest }}\` |"
            echo "| Commit (APP_REVISION) | \`${{ github.sha }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ─────────────────────────────────────────────────────────────
  deploy:
    name: Desplegar en Render
    needs: image                      # sin imagen publicada no hay despliegue
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.RENDER_SERVICE_URL }}
    # Un solo despliegue a la vez. Nunca se cancela uno en curso; si llegan
    # varios, GitHub deja en espera solo el más reciente (no hay desorden).
    concurrency:
      group: deploy-render
      cancel-in-progress: false
    steps:
      - name: Solicitar despliegue de la imagen exacta (por digest)
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          IMAGEN: ${{ needs.image.outputs.image }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          set -euo pipefail
          if [ -z "${HOOK:-}" ]; then
            echo "::error::Falta el secret RENDER_DEPLOY_HOOK_URL (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          REFERENCIA="${IMAGEN}@${DIGEST}"
          echo "Imagen a desplegar: ${REFERENCIA}"
          CODIFICADA=$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$REFERENCIA")

          # El hook ya trae ?key=...; se añade &imgURL=<imagen@digest codificada>.
          CODIGO=$(curl -sS -X POST -o respuesta.json -w '%{http_code}' "${HOOK}&imgURL=${CODIFICADA}") || CODIGO=000

          case "$CODIGO" in
            200) echo "✅ Render ACEPTÓ la solicitud y empezó el despliegue: $(cat respuesta.json)" ;;
            202) echo "⏳ Render ya tenía un despliegue en curso; este queda en cola." ;;
            400) echo "::error::Render rechazó imgURL (HTTP 400). La imagen del servicio debe ser ${IMAGEN}:latest."; exit 1 ;;
            *)   echo "::error::El deploy hook respondió HTTP ${CODIGO}. Revisa el secret y Render → Events."; exit 1 ;;
          esac
          {
            echo "### 🚀 Despliegue solicitado a Render (HTTP ${CODIGO})"
            echo "Referencia: \`${REFERENCIA}\`"
            echo ""
            echo "Solicitud aceptada ≠ despliegue completado: el job **verify** lo confirma."
          } >> "$GITHUB_STEP_SUMMARY"

  # ─────────────────────────────────────────────────────────────
  verify:
    name: Verificar nueva versión en línea
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Esperar a que la URL pública sirva el commit esperado
        env:
          URL_BASE: ${{ vars.RENDER_SERVICE_URL }}
          ESPERADO: ${{ github.sha }}
        run: |
          set -uo pipefail
          if [ -z "${URL_BASE:-}" ]; then
            echo "::error::Falta la variable RENDER_SERVICE_URL (Settings → Secrets and variables → Actions → Variables)."
            exit 1
          fi
          URL_BASE="${URL_BASE%/}"
          LIMITE=480          # tiempo máximo: 8 minutos (incluye arranque en frío)
          ESPERA=15           # segundos entre intentos
          INICIO=$SECONDS
          INTENTO=0
          echo "Esperando revisión ${ESPERADO} en ${URL_BASE}/version"

          while [ $((SECONDS - INICIO)) -lt $LIMITE ]; do
            INTENTO=$((INTENTO + 1))
            rm -f version.json
            CODIGO=$(curl -s -o version.json -w '%{http_code}' --max-time 30 "${URL_BASE}/version") || true
            REV=$(python3 -c 'import json; print(json.load(open("version.json")).get("revision", ""))' 2>/dev/null) || REV=""
            echo "Intento ${INTENTO} ($((SECONDS - INICIO)) s): HTTP ${CODIGO:-000}, revisión en línea = ${REV:-?}"

            if [ "${CODIGO:-}" = "200" ] && [ "$REV" = "$ESPERADO" ]; then
              SALUD=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "${URL_BASE}/health") || SALUD=000
              if [ "$SALUD" = "200" ]; then
                echo "✅ Nueva versión disponible: $(cat version.json)"
                {
                  echo "### ✅ Nueva versión disponible en ${URL_BASE}"
                  echo "| Comprobación | Resultado |"
                  echo "|---|---|"
                  echo "| /version | \`$(cat version.json)\` |"
                  echo "| /health | HTTP ${SALUD} |"
                  echo "| Tiempo hasta disponible | $((SECONDS - INICIO)) s (${INTENTO} intentos) |"
                } >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              echo "/version ya es correcta pero /health respondió HTTP ${SALUD}; reintentando…"
            fi
            sleep $ESPERA
          done

          echo "::error::Tras ${LIMITE} s la URL no sirve la revisión ${ESPERADO}. Revisa Render → Events y Logs del servicio."
          exit 1
